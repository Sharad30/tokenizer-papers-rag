# Every tunable value in the project lives here (see CLAUDE.md: no magic
# numbers in code). Validated by rag.common.config.Config; unknown keys are
# errors. Each phase adds its own section when its decisions are made.

# Stage folders. Each stage reads only the previous stage's folder and writes
# its own, plus a stats.json. Relative to this file's directory.
paths:
  raw: data/raw            # Phase 1: cached API responses, PDFs (gitignored)
  manifest: data/manifest  # Phase 1: corpus manifest (committed)
  parsed: data/parsed      # Phase 2: sections, chunks, references (gitignored)
  works: data/works        # Phase 5: work_id clusters (gitignored)
  index: data/index        # Phase 4/6: BM25 + dense indexes (gitignored)
  eval: eval               # Phase 3: questions.jsonl, pairs.jsonl (committed)
  results: results         # Phase 4+: eval runs (committed)
  figures: docs/figures    # Phase 4+: plots from `rag report` (committed)
  chat: data/chat          # Phase 7: chat transcripts, one JSONL per session (gitignored)
  prompts: prompts         # Phase 7: system prompts as editable files (committed)
  snapshot: data/snapshot  # showcase UI: data a fresh clone lacks (committed; D-038)

logging:
  level: INFO              # DEBUG | INFO | WARNING | ERROR

corpus:
  # Collection cutoff. Papers after this date are ignored, so reruns are
  # reproducible. PLAN.md's example value; confirm in Phase 1.
  max_date: 2026-10-15

collect:
  http:
    user_agent: "tokenizer-papers-rag/0.1 (+https://github.com/Sharad30/tokenizer-papers-rag)"
    contact_email_env: RAG_CONTACT_EMAIL   # set in .env; appended as (mailto:...)
    timeout_s: 60
    # Semantic Scholar's shared (no-key) pool answered 429 on about half of
    # first attempts in the first smoke run, and one batch call failed all 5
    # attempts. More attempts with capped waits: 5, 10, 20, 40, 80, 120, 120 s.
    max_attempts: 8
    backoff_base_s: 5
    max_backoff_s: 120
    default_min_interval_s: 1.0
    min_interval_s:
      export.arxiv.org: 3.0         # arXiv API terms: max 1 request / 3 s
      oaipmh.arxiv.org: 3.0         # no stated limit; same as the API to be safe
      api.semanticscholar.org: 3.0  # no key: shared pool; 1.1 s drew frequent 429s
      aclanthology.org: 1.0         # no published policy; self-throttled

  arxiv:
    # Search is stemmed: "tokenization" also matches "token(s)", so title
    # queries pull in many off-topic papers. The relevance filter sorts them out.
    categories: [cs.CL, cs.LG, cs.AI]
    page_size: 500
    max_results_per_query: 3000
    # Drafted from the D-005 boundary terms; one query per sub-topic so
    # found_via shows which query found each paper.
    queries:
      - name: tokenizer_title
        query: 'ti:tokenizer OR ti:tokenizers OR ti:tokenization OR ti:tokenisation'
      - name: subword
        query: 'abs:"subword segmentation" OR abs:"subword tokenization" OR abs:"subword units" OR abs:"subword vocabulary"'
      - name: bpe_unigram_wordpiece
        query: 'abs:"byte pair encoding" OR abs:"byte-pair encoding" OR abs:sentencepiece OR abs:wordpiece OR abs:"unigram language model"'
      - name: tokenizer_free
        query: 'abs:"tokenizer-free" OR abs:"tokenization-free" OR abs:"byte-level language model" OR abs:"character-level language model"'
      - name: vocabulary_size
        query: 'abs:"vocabulary size" AND (abs:tokenizer OR abs:tokenization)'
      - name: fertility_fairness
        query: '(abs:fertility OR abs:fairness OR abs:parity) AND (abs:tokenizer OR abs:tokenization)'
      - name: tokenization_effects
        query: '(abs:arithmetic OR abs:numbers OR abs:code OR abs:reasoning) AND ti:tokenization'

  s2:
    api_key_env: SEMANTIC_SCHOLAR_API_KEY   # optional; unset = shared public pool
    batch_size: 500
    page_size: 1000
    # BPE (Sennrich) alone has tens of thousands of citing papers, nearly all
    # of which only *use* a tokenizer. Newest first, so the cap keeps recent work.
    max_items_per_anchor: 10000
    directions: [references, citations]
    anchors:  # PLAN.md / STUDY.md anchor papers
      - ARXIV:1508.07909   # Sennrich et al. 2016, BPE for NMT
      - ARXIV:1804.10959   # Kudo 2018, subword regularization (Unigram LM)
      - ARXIV:1808.06226   # Kudo & Richardson 2018, SentencePiece
      - ARXIV:2105.13626   # Xue et al. 2022, ByT5
      - ARXIV:2103.06874   # Clark et al. 2022, CANINE
      - ARXIV:2012.15613   # Rust et al. 2021, How Good is Your Tokenizer?
      - ARXIV:2305.15425   # Petrov et al. 2023, tokenizer unfairness between languages

  acl:
    enabled: true   # clones the Anthology data repo (~120 MB) to data/raw/acl-anthology

  relevance:
    # Matching is case-insensitive on whole words/phrases. List spelling and
    # hyphenation variants explicitly; there is no stemming.
    title_accept_terms: [
      tokenizer, tokenizers, tokeniser, tokenisers, tokenization, tokenisation,
      tokenizing, tokenize, subword, subwords, sub-word, "byte pair encoding",
      "byte-pair encoding", bpe, wordpiece, sentencepiece, "unigram language model",
      tokenizer-free, tokenization-free, token-free, byte-level, character-level,
    ]
    topic_terms: [
      fertility, "vocabulary size", "word segmentation", "morphological segmentation",
      out-of-vocabulary, open-vocabulary,
    ]
    # Titles naming another modality or domain: D-005 is text-only (natural
    # language and code), so these reject as off_topic_term even with a
    # tokenizer term in the title. "speech" is phrase-matched so that
    # "part-of-speech" papers are not excluded.
    title_exclude_terms: [
      "visual tokenizer", "image tokenizer", "video tokenizer", "audio tokenizer",
      "speech tokenizer", "visual tokenization", "image tokenization",
      "token pruning", "token merging", "token reduction",
      image, images, visual, vision, video, videos, "point cloud", 3d, motion,
      audio, acoustic, music, "speech recognition", "speech synthesis",
      "speech tokens", "speech language model", "spoken language model",
      text-to-speech, protein, proteins, molecule, molecules, molecular, dna,
      genome, genomic, genomics, peptide, chemical, graph, graphs,
      recommendation, recommender, location, trajectory, trajectories,
      "time series", "vector quantization", vq-vae,
    ]
    # Abstract-only matches need topic terms in this many sentences, else
    # they reject as passing_mention ("we train with a BPE tokenizer").
    min_abstract_sentences_with_term: 2
    topic_description: >-
      Research where tokenization is a primary contribution or a main
      experimental variable: subword tokenization algorithms such as BPE,
      WordPiece, Unigram and SentencePiece; byte-level, character-level and
      tokenizer-free language models; vocabulary size; multilingual tokenizer
      fairness and fertility; and the effects of tokenization on arithmetic,
      code and reasoning.
    embedding_model: BAAI/bge-small-en-v1.5
    embedding_batch_size: 64
    # Set by eye on 31 real ambiguous papers (D-008): no clean gap between in
    # and out; the audit measures the cost. Not tuned on the eval set.
    embedding_threshold: 0.745

  versions:
    # A one-word typo fix scores ~1.0; the BPE paper's v1 vs v5 abstract
    # (rewritten opening, changed BLEU numbers) scores 0.907.
    keep_v1_if_abstract_similarity_below: 0.95

  download:
    # s2 = open-access links from Semantic Scholar for papers on neither
    # arXiv nor ACL; often publisher landing pages (recorded as not_pdf).
    enabled_sources: [arxiv, acl, s2]

  audit:
    sample_per_decision: 25
    seed: 13

parse:
  grobid:
    url: http://localhost:8070
    # CRF-only image: native arm64, 0.5 GB, fast on CPU (D-013).
    image: grobid/grobid:0.9.1-crf
    workers: 4
    timeout_s: 180
    busy_retry_s: 8
    max_attempts: 5
    consolidate_header: 0       # no CrossRef calls from inside GROBID (D-014)
    consolidate_citations: 0
    tei_coordinates: [p, s, head, figure, formula, biblStruct]
  fallback:
    enabled: true               # PyMuPDF when GROBID gives nothing (D-015)
  chunk:
    tokenizer_model: BAAI/bge-small-en-v1.5   # Phase 4 baseline embedder (D-016)
    embedding_max_tokens: 512
    target_tokens: 300
    max_tokens: 448             # leaves room for the "Title > Section" header
    overlap_tokens: 40
    formula_max_chars: 120
    table_max_rows_per_chunk: 25
    captions: own_chunk

eval:
  questions_file: questions.jsonl   # Sharad's questions, under paths.eval
  # PLAN's mix (about 36 questions), as minimums per type (D-025).
  mix_min:
    lookup: 12
    multi_paper: 8
    followup: 8
    unanswerable: 6
  duplicate_sensitive_min: 3
  conversations_min: 3
  max_span_words: 60        # warn above: long spans risk crossing a chunk boundary
  find:
    max_hits: 30
  # Retrieval metrics (D-031)
  recall_k: 5
  mrr_cutoff: 10
  dup_k: 5
  bootstrap:
    samples: 1000           # resamples of the question set for 95% intervals
    seed: 0

index:
  bm25:
    method: lucene            # bm25s's Lucene variant (D-026)
    k1: 1.5                   # library default; IR-book range 1.2-2.0
    b: 0.75
    include_header: true      # "Title > Section" indexed with the body (D-029)
    stopwords: en
    split_compounds: true     # "byte-level" also indexes "byte", "level" (D-027)
  dense:
    model: BAAI/bge-small-en-v1.5
    query_prompt: "Represent this sentence for searching relevant passages: "  # model card; queries only
    prepend_header: true      # embed "header\ntext" (D-029)
    batch_size: 64
    device: cpu

retrieve:
  default_mode: hybrid        # bm25 | dense | hybrid
  default_k: 10
  candidates: 100             # each retriever's depth into fusion (D-030)
  rrf_k: 60                   # Cormack et al. 2009

chat:
  provider: ollama            # ollama | anthropic (D-032)
  ollama:
    url: http://localhost:11434
    model: qwen3:8b           # 5.2 GB; `ollama pull qwen3:8b`
    think: false              # no reasoning trace for short grounded answers
    temperature: 0
    num_ctx: 8192             # system prompt + 6 chunks (~3k tokens) + answer
    timeout_s: 300
  anthropic:
    model: claude-haiku-5-5
    api_key_env: ANTHROPIC_API_KEY
    timeout_s: 60
  max_answer_tokens: 800
  prompts:                    # files in paths.prompts; their sha256 goes in each transcript
    answer: answer_system.md
    rewrite: rewrite_system.md
  rewrite:
    enabled: true
    history_turns: 3          # exchanges the rewriter sees (D-033)
    max_answer_chars: 600     # earlier answers, truncated, as rewrite context
    max_tokens: 100
  retrieval:
    mode: hybrid
    k: 6                      # chunks in the context (D-034)
  abstain:
    # From probes/phase-7-gate.py (probe queries, not the eval set): off-topic
    # max 0.661, in-domain min 0.800, midpoint 0.73. Set lower, at 0.70: 12
    # in-domain probe queries are few, a wrongly refused real question is
    # lost, and a wrongly passed one still meets the model's NOT_SUPPORTED.
    min_dense_cosine: 0.70
    not_supported_token: NOT_SUPPORTED

showcase:
  # The Streamlit pages (`make ui`). Numbers are computed from stage outputs;
  # examples are sampled from the data, never hand-picked (D-038).
  seed: 13             # first sample of examples; "Show others" moves on from it
  examples_shown: 3
  collect:
    # Rejected abstracts are gitignored, so the snapshot keeps this many per
    # decision path for a fresh clone to draw examples from.
    pool_per_path: 40

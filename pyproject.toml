[project]
name = "tokenizer-papers-rag"
version = "0.1.0"
description = "RAG and grounded chatbot over research papers on LLM tokenizers"
readme = "README.md"
authors = [
    { name = "Sharad Shriyan", email = "sharad30.ss@gmail.com" }
]
requires-python = ">=3.11.4"
dependencies = [
    "acl-anthology>=1.3.4",
    "bm25s>=0.3.15",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "pydantic>=2.14.1",
    "pymupdf>=1.28.2,<2",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.2.0",
    "typer>=0.27.3",
]

[project.scripts]
rag = "rag.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The distribution is tokenizer-papers-rag, but the import name and CLI are
# both `rag`, which keeps imports short: `from rag.common.config import ...`.
module-name = "rag"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # PyMuPDF's SWIG bindings trigger this on import (Python 3.11+); harmless.
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle errors, I: import order, UP: modern syntax,
# B: common bug patterns (mutable defaults etc.).
select = ["E", "F", "I", "UP", "B"]

[project]
name = "tokenizer-papers-rag"
version = "0.1.0"
description = "RAG and grounded chatbot over research papers on LLM tokenizers"
readme = "README.md"
authors = [
    { name = "Sharad Shriyan", email = "sharad30.ss@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.scripts]
rag = "rag.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The distribution is tokenizer-papers-rag, but the import name and CLI are
# both `rag`, which keeps imports short: `from rag.common.config import ...`.
module-name = "rag"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle errors, I: import order, UP: modern syntax,
# B: common bug patterns (mutable defaults etc.).
select = ["E", "F", "I", "UP", "B"]

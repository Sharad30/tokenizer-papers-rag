# Synthetic config for tests: every section present, nothing extra.
paths:
  raw: out/raw
  manifest: out/manifest
  parsed: out/parsed
  works: out/works
  index: out/index
  eval: out/eval
  results: out/results
  figures: out/figures
logging:
  level: DEBUG
corpus:
  max_date: 2025-01-31
collect:
  http:
    user_agent: "test-agent/0.0"
    contact_email_env: TEST_CONTACT_EMAIL
    timeout_s: 5
    max_attempts: 3
    backoff_base_s: 1
    default_min_interval_s: 0.5
    min_interval_s:
      api.example.org: 2.0
  arxiv:
    categories: [cs.CL]
    page_size: 2
    max_results_per_query: 10
    queries:
      - name: bpe
        query: 'abs:"byte pair encoding"'
  s2:
    api_key_env: TEST_S2_KEY
    batch_size: 2
    page_size: 2
    max_items_per_anchor: 10
    directions: [references]
    anchors: ["ARXIV:0000.00000"]

# Synthetic config for tests: every section present, nothing extra.
paths:
  raw: out/raw
  manifest: out/manifest
  parsed: out/parsed
  works: out/works
  index: out/index
  eval: out/eval
  results: out/results
  figures: out/figures
  chat: out/chat
  prompts: out/prompts
  snapshot: out/snapshot
  probes: out/probes
logging:
  level: DEBUG
corpus:
  max_date: 2025-01-31
collect:
  http:
    user_agent: "test-agent/0.0"
    contact_email_env: TEST_CONTACT_EMAIL
    timeout_s: 5
    max_attempts: 3
    backoff_base_s: 1
    max_backoff_s: 60
    default_min_interval_s: 0.5
    min_interval_s:
      api.example.org: 2.0
  arxiv:
    categories: [cs.CL]
    page_size: 2
    max_results_per_query: 10
    queries:
      - name: bpe
        query: 'abs:"byte pair encoding"'
  s2:
    api_key_env: TEST_S2_KEY
    batch_size: 2
    page_size: 2
    max_items_per_anchor: 10
    directions: [references]
    anchors: ["ARXIV:0000.00000"]
  acl:
    enabled: false
  relevance:
    title_accept_terms: [tokenizer, bpe, byte-pair encoding, subword]
    topic_terms: [fertility]
    title_exclude_terms: [visual tokenizer]
    min_abstract_sentences_with_term: 2
    topic_description: "Tokenization research."
    embedding_model: test/model
    embedding_batch_size: 2
    embedding_threshold: 0.5
  versions:
    keep_v1_if_abstract_similarity_below: 0.9
  download:
    enabled_sources: [arxiv]
  audit:
    sample_per_decision: 2
    seed: 0
parse:
  grobid:
    url: http://grobid.test
    image: grobid/grobid:test
    workers: 2
    timeout_s: 5
    busy_retry_s: 1
    max_attempts: 3
    consolidate_header: 0
    consolidate_citations: 0
    tei_coordinates: [p, s]
  fallback:
    enabled: true
  clean:
    min_entry_sentences: 2
    min_entry_share: 0.3
    max_fragment_words: 15
  chunk:
    tokenizer_model: test/whitespace
    embedding_max_tokens: 40
    target_tokens: 20
    max_tokens: 30
    overlap_tokens: 5
    formula_max_chars: 20
    table_max_rows_per_chunk: 2
    captions: own_chunk
dedup:
  seed: 0
  steps: [ids, title, minhash]
  author_overlap_min: 0.5
  title:
    min_ratio: 97
    review_ratio: 85
    review_min_jaccard: 0.2
    year_gap_max: 2
  minhash:
    shingle_words: 3
    num_perm: 64
    bands: 16
    rows: 4
    min_jaccard: 0.5
  cluster_floor: 0.2
  canonical_order: [acl, arxiv, s2]
  surveys:
    title_cues: [survey]
    reference_title_min: 95
    restate_min: 0.8
  pairs:
    seed: 0
    candidates_file: pairs_candidates.jsonl
    per_band: {id_linked: 1, fuzzy_merged: 1, near_miss: 1, topical: 1}
    near_miss_title_min: 75
    near_miss_jaccard_min: 0.1
    topical_pool: 5
eval:
  questions_file: questions.jsonl
  pairs_file: pairs.jsonl              # Sharad's labelled record pairs (D-042)
  mix_min:
    lookup: 1
    multi_paper: 1
    followup: 1
    unanswerable: 1
  duplicate_sensitive_min: 1
  conversations_min: 1
  max_span_words: 12
  find:
    max_hits: 3
  recall_k: 2
  mrr_cutoff: 3
  dup_k: 2
  bootstrap:
    samples: 100
    seed: 0
index:
  bm25:
    method: lucene
    k1: 1.5
    b: 0.75
    include_header: true
    stopwords: en
    split_compounds: true
  dense:
    model: test/fake
    query_prompt: "query: "
    prepend_header: true
    batch_size: 2
    device: cpu
retrieve:
  default_mode: hybrid
  default_k: 3
  candidates: 5
  rrf_k: 60
  dedup:
    enabled: false
    canonical_only: true
    per_work_cap: 1
    survey_demotion: true
    mmr_lambda: null
chat:
  provider: ollama
  ollama:
    url: http://ollama.test
    model: test-model
    think: false
    temperature: 0
    num_ctx: 2048
    timeout_s: 5
  anthropic:
    model: claude-test
    api_key_env: TEST_ANTHROPIC_KEY
    timeout_s: 5
  max_answer_tokens: 64
  prompts:
    answer: answer_system.md
    rewrite: rewrite_system.md
  rewrite:
    enabled: true
    history_turns: 2
    max_answer_chars: 100
    max_tokens: 20
  retrieval:
    mode: hybrid
    k: 3
  abstain:
    min_dense_cosine: 0.2
    not_supported_token: NOT_SUPPORTED
showcase:
  seed: 1
  examples_shown: 2
  collect:
    pool_per_path: 3
  parse:
    pool_size: 2
    snapshot_papers: 1
    token_bin_width: 10
    bibliography_min_matches: 2
  dedup:
    pool_size: 3
